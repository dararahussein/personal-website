<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Darara Hussein — Software Engineer</title>
  <meta
    name="description"
    content="Darara Hussein — Software Engineer & CS student at the University of Minnesota. Former software engineering intern at Mercury and Intuit."
  />
  <meta property="og:title" content="Darara Hussein — Software Engineer" />
  <meta
    property="og:description"
    content="Computer Science @ University of Minnesota. Former software engineering intern at Mercury and Intuit."
  />
  <meta property="og:type" content="website" />
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111113'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' fill='%23ffffff' font-family='monospace' font-weight='700' font-size='14'%3EDH%3C/text%3E%3C/svg%3E"
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./styles.css" />
  <script>
    // Apply saved theme before paint to prevent flash
    (function () {
      try {
        var saved = localStorage.getItem("dh_portfolio_theme");
        if (saved === "dark" || saved === "light") {
          document.documentElement.setAttribute("data-theme", saved);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="shell">
    <!-- Minimal Top Navigation -->
    <header class="topbar">
      <a href="#" class="brand" id="brand-home">dhussein.com</a>
      <div class="topbar-right">
        <nav class="topnav" aria-label="Primary sections">
          <a href="#experience">Experience</a>
          <a href="#work">Work</a>
          <a href="#notes">Notes</a>
        </nav>
        <button
          type="button"
          class="theme-toggle"
          id="theme-toggle"
          aria-label="Toggle theme"
        ></button>
      </div>
    </header>

    <main>
      <!-- Single-Column Home View -->
      <div id="home-view" class="home-view">
        <!-- Intro -->
        <section id="intro" aria-label="Introduction"></section>

        <!-- Experience -->
        <section id="experience" class="section" aria-labelledby="exp-heading">
          <div class="section-header">
            <h2 id="exp-heading" class="section-label">Experience</h2>
          </div>
          <div id="experience-list" class="exp-list"></div>
        </section>

        <!-- Selected Work -->
        <section id="work" class="section" aria-labelledby="work-heading">
          <div class="section-header">
            <h2 id="work-heading" class="section-label">Selected Work</h2>
            <span class="section-hint">Click to expand</span>
          </div>
          <div id="work-list" class="work-list"></div>
        </section>

        <!-- Notes / Writing -->
        <section id="notes" class="section" aria-labelledby="notes-heading">
          <div class="section-header">
            <h2 id="notes-heading" class="section-label">Notes</h2>
          </div>
          <div id="notes-list" class="notes-list"></div>
        </section>
      </div>

      <!-- Distraction-Free Article Reader View (when clicking a Note) -->
      <div id="article-view" class="article-view" hidden></div>
    </main>

    <!-- Minimal Footer -->
    <footer class="footer">
      <span id="local-clock" class="clock-mono">Minneapolis, MN</span>
      <div id="footer-links" class="footer-links"></div>
    </footer>
  </div>

  <script src="./data.js"></script>
  <script src="./script.js"></script>
</body>
</html>
